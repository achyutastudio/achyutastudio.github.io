<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achyuta Studio | Something Beautiful Is In The Works</title>
    
    <!-- BRAND FAVICON CONNECTION -->
    <link rel="icon" type="image/png" href="./favicon.png?v=200">
    
    <!-- TYPOGRAPHY CONNECTIONS -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #08090a;
            --text-color: #f3f4f6;
            --accent-color: #d4af37; /* Clean Studio Gold */
            --text-muted: #626875;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Bar Status Placement Only - Left Logo Removed */
        nav {
            display: flex;
            justify-content: flex-end; /* Pushes content to the right */
            align-items: center;
            padding: 2.5rem 5%;
            position: absolute;
            width: 100%;
            z-index: 10;
        }

        .status-badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            background-color: rgba(212, 175, 55, 0.01);
        }

        /* Center Landing Content Presentation Container */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1.5rem;
            z-index: 5;
        }

        /* BOLD TEXT BRANDING LOGO - REMOVES DARK BLENDING BLOCKS */
        .brand-text-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            color: var(--text-color);
        }

        .brand-text-logo span {
            color: var(--accent-color);
        }

        .main-container h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 400;
            line-height: 1.3;
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
        }

        .main-container h1 span {
            font-style: italic;
            color: var(--accent-color);
        }

        .main-container p {
            font-size: clamp(0.95rem, 1.5vw, 1.1rem);
            color: var(--text-muted);
            max-width: 540px;
            font-weight: 200;
            margin-bottom: 3.5rem;
            letter-spacing: 0.5px;
        }

        /* Interactive Inquiry Element */
        .contact-trigger {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 0.5rem;
            transition: color 0.3s, border-color 0.3s;
        }

        .contact-trigger:hover {
            color: var(--accent-color);
            border-color: var(--text-color);
        }

        /* Footer Layout Area */
        footer {
            padding: 2.5rem 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            z-index: 10;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }

        footer a:hover {
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <!-- Minimal Header Layout Container -->
    <nav>
        <div class="status-badge">Coming Soon 2026</div>
    </nav>

    <!-- Main Focused Landing Panel -->
    <main class="main-container">
        
        <!-- Typography Logo Replacing Blending Graphics -->
        <div class="brand-text-logo">Achyuta<span>.</span></div>
        
        <h1>Something beautiful is <span>in the works</span>.</h1>
        <p>Achyuta Studio is currently crafting an elevated digital environment. Our full interactive studio portfolio display platform will premiere shortly.</p>
        
        <a href="mailto:hello@shopachyutastudio.com" class="contact-trigger">Inquire Early</a>
    </main>

    <!-- Base Footer Identification Block -->
    <footer>
        <p>&copy; 2026 <a href="https://shopachyutastudio.com">Achyuta Studio</a>. Active and encrypted.</p>
    </footer>

</body>
</html>
