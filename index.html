<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achyuta Studio | Something Beautiful Is In The Works</title>
    
    <!-- BRAND FAVICON CONNECTION -->
    <link rel="icon" type="image/png" href="./favicon.png?v=1000">
    
    <!-- TYPOGRAPHY CONNECTIONS -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background-color: #ffffff !important;
            color: #1a1c1e !important;
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.6;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100vw;
        }

        nav {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 2.5rem 5%;
            position: absolute;
            width: 100%;
            z-index: 10;
        }

        .status-badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #1a1c1e;
            border: 1px solid #1a1c1e;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-weight: 500;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1.5rem;
            z-index: 5;
            background-color: #ffffff !important;
        }

        /* EXPANDED LOGO FRAME DIMENSIONS */
        .hero-logo-wrapper {
            margin-bottom: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .hero-logo-wrapper img {
            height: 240px; /* Scaled up from 140px for full visibility */
            width: auto;
            display: block;
        }

        .main-container h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 400;
            line-height: 1.3;
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
            color: #1a1c1e !important;
        }

        .main-container h1 span {
            font-style: italic;
            color: #bfa15f; 
        }

        .main-container p {
            font-size: clamp(0.95rem, 1.5vw, 1.1rem);
            color: #626875;
            max-width: 540px;
            font-weight: 300;
            margin-bottom: 3.5rem;
            letter-spacing: 0.3px;
        }

        .contact-trigger {
            color: #1a1c1e;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 2px solid #bfa15f;
            padding-bottom: 0.5rem;
            font-weight: 500;
            transition: color 0.3s, border-color 0.3s;
        }

        .contact-trigger:hover {
            color: #bfa15f;
            border-color: #1a1c1e;
        }

        footer {
            padding: 2.5rem 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: #626875;
            letter-spacing: 0.5px;
            z-index: 10;
            border-top: 1px solid #e5e7eb;
            background-color: #ffffff !important;
        }

        footer a {
            color: #626875;
            text-decoration: none;
        }
    </style>
</head>
<body style="background-color: #ffffff !important;">

    <nav>
        <div class="status-badge">Coming Soon 2026</div>
    </nav>

    <main class="main-container" style="background-color: #ffffff !important;">
        
        <div class="hero-logo-wrapper">
            <img src="./favicon.png?v=1000" alt="Achyuta Studio Logo">
        </div>
        
        <h1 style="color: #1a1c1e !important;">Something beautiful is <span>in the works</span>.</h1>
        <p>Achyuta Studio is currently crafting an elevated digital environment. Our full interactive studio portfolio display platform will premiere shortly.</p>
        
        <a href="mailto:hello@shopachyutastudio.com" class="contact-trigger">Inquire Early</a>
    </main>

    <footer style="background-color: #ffffff !important;">
        <p>&copy; 2026 <a href="https://shopachyutastudio.com">Achyuta Studio</a>. Active and encrypted.</p>
    </footer>

</body>
</html>
