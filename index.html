<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achyuta Studio | Something Beautiful Is In The Works</title>
    
    <!-- FAVICON ICON CONNECTIONS WITH CACHE BUSTERS -->
    <link rel="icon" type="image/png" href="./favicon.png?v=5">
    
    <!-- TYPOGRAPHY CONNECTIONS -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0e12;
            --text-color: #f3f4f6;
            --accent-color: #d4af37; /* Elegant Gold */
            --text-muted: #8e95a2;
            --glow-color: rgba(147, 51, 234, 0.15); /* Purple studio glow fallback */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow: hidden; /* Clean viewport block */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Ambient Background Graphics for Transparent Logo */
        .ambient-glow {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--glow-color) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* Top Navigation Header Layout */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem 5%;
            position: absolute;
            width: 100%;
            z-index: 10;
        }

        /* FIXED NAVBAR LOGO CONTRAST FILTER */
        .nav-logo img {
            height: 38px;
            width: auto;
            display: block;
            filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.6)) brightness(1.2);
            transition: all 0.3s;
        }

        .nav-logo img:hover {
            filter: drop-shadow(0px 0px 12px rgba(212, 175, 55, 0.8)) brightness(1.4);
        }

        .status-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            background-color: rgba(212, 175, 55, 0.02);
        }

        /* Center Landing Content Layout */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1.5rem;
            z-index: 5;
            position: relative;
            margin-top: 2rem;
        }

        /* FIXED CENTRAL LOGO CONTRAST & RADIAL GLOW */
        .hero-logo-wrapper {
            margin-bottom: 2.5rem;
            position: relative;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0) 65%);
            padding: 2rem;
            border-radius: 50%;
        }

        .hero-logo-wrapper img {
            height: 120px; /* Enhanced presence sizing */
            width: auto;
            display: block;
            /* Combined filters to illuminate dark graphics onto pitch black canvas */
            filter: drop-shadow(0px 0px 15px rgba(255, 255, 255, 0.5)) drop-shadow(0px 10px 25px rgba(0, 0, 0, 0.9)) brightness(1.2);
        }

        .main-container h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
        }

        .main-container h1 span {
            font-style: italic;
            color: var(--accent-color);
        }

        .main-container p {
            font-size: clamp(0.95rem, 1.5vw, 1.15rem);
            color: var(--text-muted);
            max-width: 580px;
            font-weight: 300;
            margin-bottom: 3.5rem;
            letter-spacing: 0.3px;
        }

        /* Minimal Call-To-Action Element */
        .contact-trigger {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 0.5rem;
            transition: color 0.3s, border-color 0.3s;
        }

        .contact-trigger:hover {
            color: var(--accent-color);
            border-color: var(--text-color);
        }

        /* Footer Layout Area */
        footer {
            padding: 2.5rem 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            z-index: 10;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }

        footer a:hover {
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <!-- Ambient Visual Glow Behind Logo Placement -->
    <div class="ambient-glow"></div>

    <!-- Top Navigation Header -->
    <nav>
        <div class="nav-logo">
            <img src="./favicon.png?v=5" alt="Achyuta Studio Icon">
        </div>
        <div class="status-badge">Studio Launch 2026</div>
    </nav>

    <!-- Center Landing Area Content -->
    <main class="main-container">
        <div class="hero-logo-wrapper">
            <img src="./favicon.png?v=5" alt="Achyuta Studio Central Logo">
        </div>
        <h1>Something beautiful is <span>in the works</span>.</h1>
        <p>Achyuta Studio is currently crafting an elevated digital space. Our full brand showcase and interactive portfolio solutions platform will premiere shortly.</p>
        <a href="mailto:hello@shopachyutastudio.com" class="contact-trigger">Inquire Early</a>
    </main>

    <!-- Footer Area Layout -->
    <footer>
        <p>&copy; 2026 <a href="https://shopachyutastudio.com">Achyuta Studio</a>. Securely encrypted and active.</p>
    </footer>

</body>
</html>
